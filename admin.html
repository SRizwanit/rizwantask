<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>অ্যাডমিন প্যানেল - কিতাব প্রুফিং</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
</head>
<body>
<header class="top">
  <button id="bBack" class="sm"><span data-ic="left"></span>টাস্ক</button>
  <h2>অ্যাডমিন প্যানেল</h2>
  <button id="bOut" class="sm"><span data-ic="logout"></span>লগআউট</button>
</header>
<main class="wrap wide">
  <div class="tabs">
    <button id="tUsers" class="on"><span data-ic="users"></span>ব্যবহারকারী</button>
    <button id="tBooks"><span data-ic="book"></span>কিতাব</button>
    <button id="tSet"><span data-ic="settings"></span>সেটিংস</button>
  </div>

  <!-- USERS -->
  <section id="pUsers">
    <div class="row" style="margin-bottom:12px">
      <input id="uq" type="search" placeholder="নাম বা নাম্বার দিয়ে খুঁজুন" style="flex:1;min-width:200px">
      <span class="badge" id="uCount"></span>
      <button id="uReload" class="sm"><span data-ic="refresh"></span></button>
    </div>
    <div id="uList"></div>
  </section>

  <!-- BOOKS -->
  <section id="pBooks" hidden>
    <div class="row" style="margin-bottom:12px"><b style="flex:1">সব কিতাব</b>
      <button id="bAdd" class="primary sm"><span data-ic="plus"></span>নতুন কিতাব</button></div>
    <div id="bList"></div>
  </section>

  <!-- SETTINGS -->
  <section id="pSet" hidden style="max-width:640px">
    <div class="card">
      <b>GitHub ও Gemini সেটিংস</b>
      <p class="hint">এই মানগুলো Supabase-এ থাকে এবং সব কিতাবের view.html-এ প্রযোজ্য হয়। ফাঁকা রাখলে view.html-এর ডিফল্ট ব্যবহার হবে।</p>
      <label class="f" for="sTok">GitHub Token</label><input id="sTok" type="password" autocomplete="off" placeholder="github_pat_...">
      <label class="f" for="sKey">Gemini API Key</label><input id="sKey" type="password" autocomplete="off" placeholder="AIza...">
      <label class="f" for="sMod">Model</label><input id="sMod" type="text" placeholder="gemini-3.5-flash-lite">
      <label class="f" for="sTmp">Temperature (০ – ২)</label><input id="sTmp" type="number" min="0" max="2" step="0.1">
      <label class="f" for="sP1">Prompt - এপি আই ১ (ছবি থেকে টেক্সট / OCR)</label><textarea id="sP1" rows="6"></textarea>
      <label class="f" for="sP2">Prompt - এপি আই ২ (টেক্সট প্রুফিং)</label><textarea id="sP2" rows="6"></textarea>
      <button id="sSave" class="primary block" style="margin-top:18px">সংরক্ষণ</button>
    </div>
  </section>
</main>

<!-- book dialog -->
<dialog id="bDlg">
  <h3 id="bdT">নতুন কিতাব</h3>
  <label class="f" for="fName">কিতাবের নাম *</label><input id="fName" type="text">
  <label class="f" for="fAuth">কিতাবের লেখকের নাম</label><input id="fAuth" type="text">
  <label class="f" for="fCover">কিতাবের ছবির লিংক</label><input id="fCover" type="url" placeholder="https://...">
  <label class="f" for="fPdf">কিতাবের পিডিএফ লিংক</label><input id="fPdf" type="url" placeholder="https://...">
  <label class="f" for="fGu">GitHub Username *</label><input id="fGu" type="text" autocapitalize="off" placeholder="SunniPedia">
  <label class="f" for="fRepo">Repo Name *</label><input id="fRepo" type="text" autocapitalize="off" placeholder="pdftojpg">
  <label class="f" for="fBr">Branch (ঐচ্ছিক)</label><input id="fBr" type="text" autocapitalize="off" placeholder="main">
  <label class="f" for="fFold">রিপোর ফোল্ডার প্রিফিক্স</label><input id="fFold" type="text" autocapitalize="off" placeholder="যেমন: bukhari (ফাঁকা থাকলে কিতাবের নাম)">
  <p class="hint">ফোল্ডার হবে <b>প্রিফিক্স_pages</b>, <b>প্রিফিক্স_texts</b>, <b>প্রিফিক্স_proofed.json</b></p>
  <div class="err" id="bdErr"></div>
  <div class="acts"><button id="bdCancel">বন্ধ</button><button id="bdSave" class="primary">সংরক্ষণ</button></div>
</dialog>

<!-- pin dialog -->
<dialog id="pDlg">
  <h3>PIN রিসেট</h3>
  <p class="hint" id="pdWho"></p>
  <button id="pdClear" class="block" style="margin-top:10px">PIN মুছুন (ইউজার পরের লগইনে নতুন PIN দেবে)</button>
  <label class="f" for="pdNew">অথবা সরাসরি নতুন ৪ ডিজিটের PIN দিন</label>
  <input id="pdNew" class="pin" type="text" inputmode="numeric" maxlength="4" placeholder="----">
  <div class="err" id="pdErr"></div>
  <div class="acts"><button id="pdCancel">বন্ধ</button><button id="pdSet" class="primary">নতুন PIN সেট</button></div>
</dialog>

<script src="common.js"></script>
<script>
(async () => {
const {$,esc,toast}=App;
const me=await App.requireAuth({admin:true});
App.hydrateIcons();
$('bBack').onclick=()=>location.href='task.html'; $('bOut').onclick=()=>App.logout();
const PM={bkash:'বিকাশ',nagad:'নগদ'}, enc=encodeURIComponent;
let users=[],books=[];

/* tabs */
const tabs={Users:'pUsers',Books:'pBooks',Set:'pSet'};
Object.keys(tabs).forEach(k=>$('t'+k).onclick=()=>{
  Object.entries(tabs).forEach(([n,p])=>{$(p).hidden=n!==k;$('t'+n).classList.toggle('on',n===k);});
  if(k==='Set')loadSettings();
});

/* ---------- USERS ---------- */
async function loadUsers(){
  try{users=await App.sb.get('app_users?select=*&order=created_at.desc');renderUsers();}
  catch(e){toast(e.message,true);}
}
function renderUsers(){
  const q=$('uq').value.trim().toLowerCase();
  const l=users.filter(u=>!q||(u.full_name||'').toLowerCase().includes(q)||(u.phone||'').includes(q));
  $('uCount').textContent='মোট '+users.length+' জন';
  $('uList').innerHTML=l.length?l.map(u=>{
    const bound=!App.deviceEmpty(u.device_id), self=u.id===me.id;
    return `<div class="li" data-id="${esc(u.id)}">
      <div class="row"><b style="flex:1">${esc(u.full_name)}${App.isAdminPhone(u.phone)?' <span class="badge ok">অ্যাডমিন</span>':''}</b>
        <span class="badge ${bound?'ok':'warn'}">${bound?'ডিভাইস যুক্ত':'ডিভাইস খালি'}</span>
        <span class="badge ${App.hasPin(u)?'':'warn'}">${App.hasPin(u)?'PIN আছে':'PIN নেই'}</span></div>
      <div class="meta">মোবাইল: ${esc(u.phone)}<br>${esc(PM[u.payment_method]||'পেমেন্ট')}: ${esc(u.payment_number||'-')}<br>যোগ দিয়েছেন: ${u.created_at?new Date(u.created_at).toLocaleString('bn-BD'):'-'}</div>
      <div class="row">
        <button class="sm" data-a="pin"><span data-ic="key"></span>PIN রিসেট</button>
        <button class="sm" data-a="dev"><span data-ic="device"></span>ডিভাইস রিসেট</button>
        ${self?'':'<button class="sm danger" data-a="del"><span data-ic="trash"></span>ডিলিট</button>'}
      </div></div>`;}).join(''):'<div class="empty">কোনো ইউজার নেই</div>';
  App.hydrateIcons($('uList'));
}
$('uq').oninput=renderUsers; $('uReload').onclick=loadUsers;
let pinTarget=null;
$('uList').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const u=users.find(x=>x.id===b.closest('.li').dataset.id);if(!u)return;
  if(b.dataset.a==='pin'){pinTarget=u;$('pdWho').textContent=u.full_name+' ('+u.phone+')';$('pdNew').value='';$('pdErr').textContent='';$('pDlg').showModal();}
  else if(b.dataset.a==='dev'){
    if(!confirm(u.full_name+' এর ডিভাইস রিসেট করবেন? ইউজার অন্য ফোনে লগইন করতে পারবে।'))return;
    try{await App.sb.patch('app_users?id=eq.'+enc(u.id),{device_id:null});toast('ডিভাইস রিসেট হয়েছে');loadUsers();}catch(x){toast(x.message,true);}
  }else if(b.dataset.a==='del'){
    if(!confirm(u.full_name+' কে মুছে ফেলবেন? এটি ফেরানো যাবে না।'))return;
    try{await App.sb.del('app_users?id=eq.'+enc(u.id));toast('ইউজার ডিলিট হয়েছে');loadUsers();}catch(x){toast(x.message,true);}
  }
};
$('pdCancel').onclick=()=>$('pDlg').close();
$('pdNew').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');
$('pdClear').onclick=async()=>{
  try{await App.sb.patch('app_users?id=eq.'+enc(pinTarget.id),{password_salt:null,password_hash:null});$('pDlg').close();toast('PIN মুছে ফেলা হয়েছে');loadUsers();}catch(x){$('pdErr').textContent=x.message;}
};
$('pdSet').onclick=async()=>{
  const p=$('pdNew').value;if(p.length!==4){$('pdErr').textContent='৪ ডিজিটের PIN দিন';return;}
  try{const s=App.newSalt(),h=await App.hashPin(p,s);
    await App.sb.patch('app_users?id=eq.'+enc(pinTarget.id),{password_salt:s,password_hash:h});
    $('pDlg').close();toast('নতুন PIN সেট হয়েছে');loadUsers();}catch(x){$('pdErr').textContent=x.message;}
};

/* ---------- BOOKS ---------- */
async function loadBooks(){
  try{books=await App.sb.get('books?select=*&order=created_at.desc');renderBooks();}catch(e){toast(e.message,true);}
}
function renderBooks(){
  $('bList').innerHTML=books.length?books.map(b=>`<div class="li" data-id="${esc(b.id)}">
    <div class="row" style="flex-wrap:nowrap">
      <div style="width:44px;height:58px;border-radius:6px;overflow:hidden;background:var(--panel2);flex:none;display:flex;align-items:center;justify-content:center;color:var(--muted)">${b.cover_url?`<img src="${esc(b.cover_url)}" alt="" style="width:100%;height:100%;object-fit:cover">`:App.ic('book')}</div>
      <div style="flex:1;min-width:0"><b>${esc(b.name)}</b><div class="meta">${esc(b.author||'')}<br>${esc(b.github_username)}/${esc(b.repo_name)} &middot; ${esc((b.folder||b.name))}_pages${b.pdf_url?'<br><a href="'+esc(b.pdf_url)+'" target="_blank" rel="noopener">PDF লিংক</a>':''}</div></div>
    </div>
    <div class="row"><button class="sm" data-a="edit"><span data-ic="edit"></span>এডিট</button><button class="sm danger" data-a="del"><span data-ic="trash"></span>ডিলিট</button></div></div>`).join(''):'<div class="empty">কোনো কিতাব যোগ করা হয়নি</div>';
  App.hydrateIcons($('bList'));
}
let editId=null;
function openBook(b){
  editId=b?b.id:null;$('bdT').textContent=b?'কিতাব এডিট':'নতুন কিতাব';$('bdErr').textContent='';
  const v=b||{};
  $('fName').value=v.name||'';$('fAuth').value=v.author||'';$('fCover').value=v.cover_url||'';$('fPdf').value=v.pdf_url||'';
  $('fGu').value=v.github_username||'';$('fRepo').value=v.repo_name||'';$('fBr').value=v.branch||'';$('fFold').value=v.folder||'';
  $('bDlg').showModal();
}
$('bAdd').onclick=()=>openBook(null);$('bdCancel').onclick=()=>$('bDlg').close();
$('bList').onclick=async e=>{
  const b=e.target.closest('button[data-a]');if(!b)return;
  const bk=books.find(x=>x.id===b.closest('.li').dataset.id);if(!bk)return;
  if(b.dataset.a==='edit')openBook(bk);
  else if(confirm('"'+bk.name+'" কিতাবটি ডিলিট করবেন?')){
    try{await App.sb.del('books?id=eq.'+enc(bk.id));toast('কিতাব ডিলিট হয়েছে');loadBooks();}catch(x){toast(x.message,true);}
  }
};
$('bdSave').onclick=async()=>{
  const row={name:$('fName').value.trim(),author:$('fAuth').value.trim(),cover_url:$('fCover').value.trim(),pdf_url:$('fPdf').value.trim(),
    github_username:$('fGu').value.trim(),repo_name:$('fRepo').value.trim(),branch:$('fBr').value.trim(),folder:$('fFold').value.trim().replace(/^\/+|\/+$/g,'')};
  if(!row.name||!row.github_username||!row.repo_name){$('bdErr').textContent='কিতাবের নাম, GitHub Username ও Repo Name আবশ্যক';return;}
  try{
    if(editId)await App.sb.patch('books?id=eq.'+enc(editId),row);else await App.sb.post('books',row);
    $('bDlg').close();toast('কিতাব সংরক্ষিত হয়েছে');loadBooks();
  }catch(x){$('bdErr').textContent=x.message;}
};

/* ---------- SETTINGS ---------- */
async function loadSettings(){
  try{const r=(await App.sb.get('app_settings?id=eq.1&limit=1'))[0]||{};
    $('sTok').value=r.github_token||'';$('sKey').value=r.gemini_api_key||'';$('sMod').value=r.gemini_model||'';
    $('sTmp').value=r.gemini_temp==null?'':r.gemini_temp;$('sP1').value=r.prompt_ocr||'';$('sP2').value=r.prompt_proof||'';
  }catch(e){toast(e.message,true);}
}
$('sSave').onclick=async()=>{
  const t=parseFloat($('sTmp').value);
  const row={id:1,github_token:$('sTok').value.trim(),gemini_api_key:$('sKey').value.trim(),gemini_model:$('sMod').value.trim().replace(/^models\//,''),
    gemini_temp:Number.isFinite(t)?Math.min(2,Math.max(0,t)):null,prompt_ocr:$('sP1').value.trim(),prompt_proof:$('sP2').value.trim()};
  try{await App.sb.upsert('app_settings?on_conflict=id',row);toast('সেটিংস সংরক্ষিত হয়েছে');}catch(e){toast(e.message,true);}
};

loadUsers();loadBooks();
})();
</script>
</body>
</html>
